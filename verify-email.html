<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email — Niji</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="min-h-dvh grid place-items-center bg-[#f8f4e8] px-5 text-[#172033] dark:bg-[#212121] dark:text-[#f8f4e8]">
  <main class="w-full max-w-md rounded-[14px] border border-[#475569]/30 bg-white p-6 text-center shadow-sm dark:bg-[#2f2f2f]">
    <h1 class="text-[22px] font-bold">Email verification</h1>
    <p id="verification-result" class="mt-3 text-[14px] leading-relaxed text-[#475569] dark:text-[#d1d5db]" role="status" aria-live="polite">Verifying your email address…</p>
    <a id="continue-link" href="index.html" class="mt-6 inline-flex h-10 items-center rounded-[9px] bg-[#004687] px-5 text-[14px] font-semibold text-white" hidden>Continue to sign in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@28.1.0"></script>
  <script src="appwrite-config.js"></script>
  <script src="appwrite.js"></script>
  <script>
    (async () => {
      const result = document.getElementById('verification-result');
      const link = document.getElementById('continue-link');
      const url = new URL(window.location.href);
      const userId = url.searchParams.get('userId');
      const secret = url.searchParams.get('secret');
      url.searchParams.delete('userId');
      url.searchParams.delete('secret');
      window.history.replaceState({}, '', url);

      if (!userId || !secret) {
        result.textContent = 'This verification link is incomplete. Request a new verification email and try again.';
        link.hidden = false;
        return;
      }

      try {
        await window.nijiAppwrite.account.updateEmailVerification({ userId, secret });
        result.textContent = 'Your email is verified.';
        link.href = 'dashboard.html';
        link.textContent = 'Continue to your account';
        link.hidden = false;
      } catch (error) {
        console.error('Appwrite email verification failed:', error);
        result.textContent = `Could not verify your email: ${error.message || error}`;
        link.href = 'index.html';
        link.hidden = false;
      }
    })();
  </script>
</body>
</html>
