<!--© 2026 Niji Faculty Monitoring System Licensed under the GNU General Public License v3.0 (GPL-3.0).--> <!doctype html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <title>Professor onboarding — Niji</title> <script src="https://cdn.tailwindcss.com"></script> <script>tailwind.config={darkMode:"class"};</script> <style>body{font-family:Roboto,ui-sans-serif,system-ui,sans-serif}[hidden]{display:none!important}</style> <link rel="preconnect" href="https://fonts.googleapis.com"> <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800&display=swap" rel="stylesheet"> </head> <body class="min-h-dvh bg-[#f8f4e8] dark:bg-[#212121] transition-colors"> <p id="onboarding-loading" class="min-h-dvh grid place-items-center px-5 text-[14px] text-[#475569] dark:text-[#d1d5db]">Loading your profile…</p> <main id="onboarding-content" class="relative min-h-dvh flex items-center justify-center px-5 py-10" hidden> <div class="w-full max-w-[400px]"> <div class="flex items-start justify-between gap-6"> <div> <span class="text-[31.25px] font-bold tracking-tight text-[#172033] dark:text-[#f8f4e8]">Niji</span> <h1 class="mt-6 text-[22px] font-bold text-[#172033] dark:text-[#f8f4e8]">Professor onboarding</h1> <p class="mt-1 text-[15px] font-light text-[#1e1e1e] dark:text-[#d1d5db]">Tell us about yourself and your faculty.</p> </div> <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="shrink-0 grid place-items-center size-[34px] rounded-[10px] border border-[#475569] dark:border-[#9ca3af] text-[#172033] dark:text-[#f8f4e8]"> <svg class="block dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> <svg class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg> </button> </div> <form id="onboarding-form" class="mt-10 space-y-4"> <div> <label for="ob-last-name" class="block text-[12px] font-light text-[#475569] dark:text-[#d1d5db] mb-1">Last name</label> <input id="ob-last-name" name="lastName" autocomplete="family-name" required maxlength="80" placeholder="e.g. Dela Cruz" class="w-full h-10 rounded-[7px] border border-[#475569] dark:border-[#9ca3af] bg-[#f9f6ee] dark:bg-[#2f2f2f] px-3 text-[14px] text-[#1e1e1e] dark:text-[#f8f4e8] outline-none focus:ring-2 focus:ring-[#004687]" /> </div> <div> <label for="ob-first-name" class="block text-[12px] font-light text-[#475569] dark:text-[#d1d5db] mb-1">First name</label> <input id="ob-first-name" name="firstName" autocomplete="given-name" required maxlength="80" placeholder="e.g. Juan" class="w-full h-10 rounded-[7px] border border-[#475569] dark:border-[#9ca3af] bg-[#f9f6ee] dark:bg-[#2f2f2f] px-3 text-[14px] text-[#1e1e1e] dark:text-[#f8f4e8] outline-none focus:ring-2 focus:ring-[#004687]" /> </div> <div> <label for="ob-middle-name" class="block text-[12px] font-light text-[#475569] dark:text-[#d1d5db] mb-1">Middle name <span class="text-[#64748b] dark:text-[#9ca3af]">(optional)</span></label> <input id="ob-middle-name" name="middleName" autocomplete="additional-name" maxlength="80" placeholder="Middle name" class="w-full h-10 rounded-[7px] border border-[#475569] dark:border-[#9ca3af] bg-[#f9f6ee] dark:bg-[#2f2f2f] px-3 text-[14px] text-[#1e1e1e] dark:text-[#f8f4e8] outline-none focus:ring-2 focus:ring-[#004687]" /> </div> <div> <label for="ob-inst" class="block text-[12px] font-light text-[#475569] dark:text-[#d1d5db] mb-1">College / University / Institute</label> <input id="ob-inst" name="institution" required maxlength="100" placeholder="e.g. ICCT Colleges" class="w-full h-10 rounded-[7px] border border-[#475569] dark:border-[#9ca3af] bg-[#f9f6ee] dark:bg-[#2f2f2f] px-3 text-[14px] text-[#1e1e1e] dark:text-[#f8f4e8] outline-none focus:ring-2 focus:ring-[#004687]" /> </div> <div> <label for="faculty-input" class="block text-[12px] font-light text-[#475569] dark:text-[#d1d5db] mb-1">Faculty</label> <select id="faculty-input" name="department" required class="w-full h-10 rounded-[7px] border border-[#475569] dark:border-[#9ca3af] bg-[#f9f6ee] dark:bg-[#2f2f2f] px-3 text-[14px] text-[#1e1e1e] dark:text-[#f8f4e8] outline-none focus:ring-2 focus:ring-[#004687]"> <option value="" selected disabled>Select your faculty</option> </select> </div> <p id="form-error" role="alert" class="hidden text-[13px] text-red-700 dark:text-red-300"></p> <div class="pt-6"> <button type="submit" class="w-full h-10 rounded-[17px] border border-[#475569] dark:border-[#9ca3af] bg-[#004687] text-[#f8f4e8] text-[18px] font-extrabold">Create professor account</button> </div> </form> <p class="mt-8 text-center text-[14px] font-light text-[#1e1e1e] dark:text-[#d1d5db]"> Not you? <a id="ob-home" href="index.html" class="font-medium text-[#005a9c]">Return to Home Page</a> </p> </div> </main> <div id="verification-modal" class="fixed inset-0 z-50 grid place-items-center bg-black/50 p-5" role="dialog" aria-modal="true" aria-labelledby="verification-title" hidden> <section class="w-full max-w-[420px] rounded-[14px] border border-[#475569]/30 bg-[#f9f6ee] dark:bg-[#2f2f2f] p-6 shadow-xl"> <h2 id="verification-title" class="text-[20px] font-bold text-[#172033] dark:text-[#f8f4e8]">Professor account ready</h2> <p id="verification-message" class="mt-3 text-[14px] leading-relaxed text-[#475569] dark:text-[#d1d5db]">Your profile is saved and your professor dashboard is ready to use.</p> <button id="verification-continue" type="button" class="mt-6 w-full h-10 rounded-[9px] bg-[#004687] px-5 text-[14px] font-semibold text-white">Continue</button> </section> </div> <script src="https://cdn.jsdelivr.net/npm/appwrite@28.1.0"></script> <script src="appwrite-config.js"></script> <script src="appwrite.js"></script> <script src="store.js"></script> <script src="app.js"></script> <script>const onboardingContent=document.getElementById("onboarding-content");const loading=document.getElementById("onboarding-loading");const form=document.getElementById("onboarding-form");const formError=document.getElementById("form-error");const verificationModal=document.getElementById("verification-modal");let signup=null;let onboardingInitialized=false;let authCheckId=0;document.getElementById("ob-home").addEventListener("click",()=>{sessionStorage.removeItem(PENDING_SIGNUP_KEY)});document.getElementById("verification-continue").addEventListener("click",()=>{location.replace("dashboard.html")});async function guardOnboarding(){const checkId=++authCheckId;onboardingContent.hidden=true;loading.hidden=false;try{signup=null;const pendingSignup=sessionStorage.getItem(PENDING_SIGNUP_KEY);if(pendingSignup){let pending;try{pending=JSON.parse(pendingSignup)}catch(error){console.error("Pending sign-up details could not be read:",error);throw new Error("Your pending sign-up could not be read. Please start again.")}if(!pending||typeof pending.email!=="string"||typeof pending.password!=="string"){throw new Error("Your pending sign-up is incomplete. Please start again.")}if(pending.role!=="professor")return location.replace("onboarding.html");const passwordError=getPasswordError(pending.password);if(passwordError)throw new Error(passwordError);signup={email:pending.email.trim(),password:pending.password,role:"professor"}}const user=signup?{role:"professor",name:"",institution:"",department:"",profileComplete:false}:await currentUser();if(checkId!==authCheckId)return;if(!user)return location.replace("index.html");if(user.role!=="professor")return location.replace("onboarding.html");if(user.profileComplete)return location.replace(authDestination(user));if(!onboardingInitialized){onboardingInitialized=true;ICCT_COLLEGES.forEach(college=>{document.getElementById("faculty-input").add(new Option(college,college))});document.getElementById("ob-last-name").value=user.lastName||"";document.getElementById("ob-middle-name").value=user.middleName||"";document.getElementById("ob-first-name").value=user.firstName||"";document.getElementById("ob-inst").value=user.institution||"";document.getElementById("faculty-input").value=user.department||""}loading.hidden=true;onboardingContent.hidden=false}catch(error){if(checkId!==authCheckId)return;console.error("Could not verify the professor profile:",error);loading.textContent=`Could not load your saved profile: ${error.message||error}`}}form.addEventListener("input",()=>{formError.textContent="";formError.classList.add("hidden")});form.addEventListener("submit",async event=>{event.preventDefault();const submitButton=form.querySelector('button[type="submit"]');const details=Object.fromEntries(new FormData(form));submitButton.disabled=true;formError.textContent="";formError.classList.add("hidden");try{if(signup){const result=await nijiAuth.completeSignup({email:signup.email,password:signup.password,requestedRole:"professor",profile:{name:[details.firstName,details.middleName,details.lastName].map(part=>part.trim()).filter(Boolean).join(" "),firstName:details.firstName.trim(),middleName:details.middleName.trim(),lastName:details.lastName.trim(),institution:details.institution.trim(),department:details.department}});if(result.error)throw new Error(result.error)}else{await updateCurrentUser(user=>Object.assign(user,{name:[details.firstName,details.middleName,details.lastName].map(part=>part.trim()).filter(Boolean).join(" "),firstName:details.firstName.trim(),middleName:details.middleName.trim(),lastName:details.lastName.trim(),institution:details.institution.trim(),department:details.department,course:"",profileComplete:true}))}verificationModal.hidden=false;document.getElementById("verification-continue").focus()}catch(error){console.error("Could not save the professor onboarding profile:",error);formError.textContent=`Could not save your profile: ${error.message||error}`;formError.classList.remove("hidden");submitButton.disabled=false}});window.addEventListener("pageshow",event=>{if(event.persisted)void guardOnboarding()});window.addEventListener("pagehide",()=>{onboardingContent.hidden=true});void guardOnboarding();</script> </body> </html>
