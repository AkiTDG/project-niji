nt-medium text-[#005a9c]">Return to Home Page</a> </p> </div> </div> <script src="https://cdn.jsdelivr.net/npm/appwrite@28.1.0"></script> <script src="appwrite-config.js"></script> <script src="appwrite.js"></script> <script src="store.js"></script> <script src="app.js"></script> <script>const onboardingContent=document.getElementById("onboarding-content");const homeLink=document.getElementById("ob-home");let onboardingInitialized=false;let authCheckId=0;homeLink.addEventListener("click",event=>{event.preventDefault();nijiAuth.clearPendingSignup();void logout().catch(error=>{console.error("Could not log out from onboarding:",error);document.getElementById("ob-sub").textContent=error.message||"Could not log out. Please try again."})});async function guardOnboarding(){const checkId=++authCheckId;onboardingContent.hidden=true;const loading=document.getElementById("onboarding-loading");loading.hidden=false;try{let signup=null;const pendingSignup=sessionStorage.getItem(PENDING_SIGNUP_KEY);if(pendingSignup){let pending;try{pending=JSON.parse(pendingSignup)}catch(error){console.error("Pending sign-up details could not be read:",error);throw new Error("Your pending sign-up could not be read. Please start again.")}if(!pending||typeof pending.email!=="string"||typeof pending.password!=="string"){throw new Error("Your pending sign-up is incomplete. Please start again.")}const passwordError=getPasswordError(pending.password);if(passwordError)throw new Error(passwordError);signup={email:pending.email.trim(),password:pending.password,role:pending.role==="professor"?"professor":"student"}}const u=signup?{role:signup.role,name:"",institution:"",course:"",profileComplete:false}:await currentUser();if(checkId!==authCheckId)return;if(!u)return location.replace("index.html");if(u.role==="professor")return location.replace("professor-onboarding.html");if(u.profileComplete)return location.replace("dashboard.html");if(onboardingInitialized){loading.hidden=true;onboardingContent.hidden=false;return}onboardingInitialized=true;document.getElementById("ob-sub").textContent="Set up your student account.";const courseInput=document.getElementById("course-input");const programHelp=document.getElementById("program-help");document.getElementById("ob-last-name").value=u.lastName||"";document.getElementById("ob-middle-name").value=u.middleName||"";document.getElementById("ob-first-name").value=u.firstName||"";document.getElementById("ob-inst").value=u.institution||"";courseInput.value=u.course||"";courseInput.required=true;courseInput.disabled=false;document.getElementById("ob-inst").required=true;document.getElementById("onboarding-form").addEventListener("submit",async e=>{e.preventDefault();const submitButton=e.currentTarget.querySelector('button[type="submit"]');submitButton.disabled=true;const d=Object.fromEntries(new FormData(e.target));try{if(signup){const result=await nijiAuth.completeSignup({email:signup.email,password:signup.password,requestedRole:signup.role,profile:{name:[d.firstName,d.middleName,d.lastName].map(part=>part.trim()).filter(Boolean).join(" "),firstName:d.firstName.trim(),middleName:d.middleName.trim(),lastName:d.lastName.trim(),institution:d.institution.trim(),course:d.course,department:""}});if(result.error)throw new Error(result.error)}else{await updateCurrentUser(x=>Object.assign(x,{name:[d.firstName,d.middleName,d.lastName].map(part=>part.trim()).filter(Boolean).join(" "),firstName:d.firstName.trim(),middleName:d.middleName.trim(),lastName:d.lastName.trim(),institution:d.institution.trim(),department:"",course:d.course,profileComplete:true}))}location.href="dashboard.html"}catch(error){console.error("Could not save the onboarding profile:",error);window.alert(`Could not save your profile: ${error.message||error}`);submitButton.disabled=false}});loading.hidden=true;onboardingContent.hidden=false}catch(error){if(checkId!==authCheckId)return;console.error("Could not verify the signed-in profile:",error);loading.textContent=`Could not load your saved profile: ${error.message||error}`}}window.addEventListener("pageshow",event=>{if(event.persisted)void guardOnboarding()});window.addEventListener("pagehide",()=>{onboardingContent.hidden=true});void guardOnboarding();</script> </body> </html>
